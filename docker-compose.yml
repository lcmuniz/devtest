services:
  postgres:
    image: postgres:16-alpine
    container_name: devtest-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devtest_db
    volumes:
      - devtest_pgdata:/var/lib/postgresql/data

volumes:
  devtest_pgdata:
